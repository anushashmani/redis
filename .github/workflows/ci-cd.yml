name: Upstash Redis & Next.js CI/CD Pipeline

on:
  push:
    branches: [ main ] # Only runs on main branch push / merge


jobs:
  quality-check:
    name: 🔍 Step 1 - TypeScript & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

  build-and-test:
    name: 🧪 Step 2 - Production Build & 10 Integration Tests
    needs: quality-check
    runs-on: ubuntu-latest
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Start Next.js Server & Wait for Port 3000
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run 10 Automated Integration Tests
        run: node test-redis-caching.mjs

  deploy-staging:
    name: 🧪 Step 3 - Automatic Deploy to Staging URL
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-redis-control-room.vercel.app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "========================================================"
          echo "🧪 Deployed Successfully to Staging Environment!"
          echo "👉 Staging URL: https://staging-redis-control-room.vercel.app"
          echo "✅ Ready for QA Testing & Stakeholder Review!"
          echo "========================================================"

  deploy-production:
    name: 🛡️ Step 4 - Production Deployment Gate (Manual Approval)
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://redis-control-room.vercel.app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "========================================================"
          echo "🎉 Verified & Approved by Tech Lead!"
          echo "🚀 LIVE IN PRODUCTION: https://redis-control-room.vercel.app"
          echo "========================================================"
